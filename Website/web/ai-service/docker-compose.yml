version: '3.8'

services:
  ai-service:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PORT=5000
      - DEBUG=True
      - MIN_CONFIDENCE_THRESHOLD=0.3
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  message-poller:
    build: .
    command: python message_poller.py
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - MIN_CONFIDENCE_THRESHOLD=0.3
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - ai-service

















